    // Loop over all <img> tags and update them so a.jpg becomes
    // kalender-ikc-borgman-opw-2425/page-sep-a.jpg, etc.
    // ENABLE if you have the "photos/kalender-ikc-borgman-opw-2526" dir..
    if (0) {
        const images = Array.prototype.slice.call(document.getElementsByTagName('img'));
        images.forEach((img) => {
            if (img.className == 'photo') {
                let divPage = img;
                while (divPage.className != 'page') {
                    divPage = divPage.parentNode;
                }
                const slashIdx = img.src.lastIndexOf('/');
                img.src = (
                    img.src.substring(0, slashIdx + 1) +
                    'kalender-ikc-borgman-opw-2526/' +
                    divPage.id + '-' + img.src.substring(slashIdx + 1));
